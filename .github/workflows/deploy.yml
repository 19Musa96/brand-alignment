name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: gen-lang-client-0489066588
  GCR_IMAGE: gcr.io/gen-lang-client-0489066588/brand-alignment
  CLOUD_RUN_SERVICE: brand-alignment
  CLOUD_RUN_REGION: africa-south1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GCR_IMAGE }}:latest
            ${{ env.GCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.GCR_IMAGE }}:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          flags: |
            --memory=4Gi
            --allow-unauthenticated
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            WIKIPEDIA_USER_AGENT=${{ secrets.WIKIPEDIA_USER_AGENT }}

      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format 'value(status.url)')
          echo "Service URL: ${SERVICE_URL}"

          # Retry up to 5 times with 10s delay for the service to become healthy
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/_stcore/health")
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1
